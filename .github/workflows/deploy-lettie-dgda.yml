name: 🚀 Déploiement automatique LETTIE-DGDA

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to LETTIE-DGDA VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST_LETTIE_DGDA }}
          username: ${{ secrets.VPS_USER_LETTIE_DGDA }}
          key: ${{ secrets.VPS_SSH_KEY_LETTIE_DGDA }}

          script: |
            set -e

            cd /var/www/vhosts/belej-erp.com/dgda-lettie.belej-erp.com

            echo "=== Fetching GitHub ==="
            git fetch origin main

            echo "=== Deploying ==="
            git reset --hard origin/main

            echo "=== Fixing permissions ==="
            chown -R belej-erp.com_w1byz3rcb7a:psacln /var/www/vhosts/belej-erp.com/dgda-lettie.belej-erp.com
            chown belej-erp.com_w1byz3rcb7a:psaserv /var/www/vhosts/belej-erp.com/dgda-lettie.belej-erp.com

            echo "=== Current version ==="
            git log -1 --oneline

            echo "=== Deployment completed ==="