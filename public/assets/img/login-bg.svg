<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D2740"/><stop offset=".55" stop-color="#14395A"/><stop offset="1" stop-color="#1F4E79"/></linearGradient>
    <radialGradient id="glow" cx=".72" cy=".42" r=".6"><stop offset="0" stop-color="#6FA3D0" stop-opacity=".32"/><stop offset="1" stop-color="#6FA3D0" stop-opacity="0"/></radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F7FA"/><stop offset="1" stop-color="#C9D6E2"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F6494"/><stop offset="1" stop-color="#1B4468"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
    <g id="archive"><rect width="118" height="170" rx="5" fill="url(#box)"/><rect x="18" y="26" width="82" height="40" rx="3" fill="#FFFFFF" fill-opacity=".85"/><rect x="28" y="38" width="62" height="5" fill="#1F4E79"/><rect x="28" y="50" width="40" height="5" fill="#7D93A8"/><circle cx="59" cy="136" r="10" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="3"/></g>
    <g id="envelope"><rect width="150" height="100" rx="7" fill="url(#sheet)"/><path d="M4 6 75 58 146 6" fill="none" stroke="#7D93A8" stroke-width="4"/></g>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Rayonnages d'archives -->
  <g opacity=".5">
    <g transform="translate(1040 120)"><use href="#archive"/><use href="#archive" x="130"/><use href="#archive" x="260"/><use href="#archive" x="390"/><use href="#archive" x="520"/><use href="#archive" x="650"/><rect x="-20" y="170" width="880" height="12" fill="#0B2135"/></g>
    <g transform="translate(1040 350)"><use href="#archive"/><use href="#archive" x="130"/><use href="#archive" x="260"/><use href="#archive" x="390"/><use href="#archive" x="520"/><use href="#archive" x="650"/><rect x="-20" y="170" width="880" height="12" fill="#0B2135"/></g>
  </g>

  <!-- Parcours d'un courrier -->
  <path d="M-20 900 C 300 760 520 960 820 830 S 1300 700 1960 800" fill="none" stroke="#9CC2E3" stroke-opacity=".5" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round"/>
  <g transform="translate(250 790) rotate(-6)" opacity=".8"><use href="#envelope"/></g>
  <g transform="translate(620 860) rotate(4)" opacity=".65"><use href="#envelope"/></g>

  <!-- Lettre officielle avec QR code et cachet -->
  <g transform="translate(1250 590) rotate(-5)">
    <rect x="14" y="16" width="380" height="440" rx="6" fill="#06182A" fill-opacity=".45"/>
    <rect width="380" height="440" rx="6" fill="url(#sheet)"/>
    <rect x="34" y="36" width="150" height="12" fill="#1F4E79"/><rect x="34" y="60" width="96" height="7" fill="#7D93A8"/>
    <g fill="#8FA2B4"><rect x="34" y="110" width="312" height="7"/><rect x="34" y="132" width="312" height="7"/><rect x="34" y="154" width="280" height="7"/><rect x="34" y="176" width="312" height="7"/><rect x="34" y="198" width="210" height="7"/></g>
    <g transform="translate(34 260)" fill="#12324F">
      <path d="M0 0h36v36H0zM7 7v22h22V7zM13 13h10v10H13zM64 0h36v36H64zM71 7v22h22V7zM77 13h10v10H77zM0 64h36v36H0zM7 71v22h22V71zM13 77h10v10H13z" fill-rule="evenodd"/>
      <path d="M44 0h8v8h-8zM44 16h12v8H44zM44 32h8v12h-8zM0 44h12v8H0zM20 44h16v8H20zM44 52h12v8H44zM64 44h8v12h-8zM80 44h20v8H80zM44 68h8v8h-8zM60 64h12v8H60zM80 60h8v12h-8zM92 64h8v8h-8zM44 84h16v8H44zM68 80h8v20h-8zM84 80h16v8H84zM88 92h12v8H88z"/>
    </g>
    <g transform="translate(262 330) rotate(-12)" fill="none" stroke="#B4342B" stroke-opacity=".75"><circle r="58" stroke-width="5"/><circle r="44" stroke-width="2"/><path d="M-24 2 -6 20 28 -18" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>
